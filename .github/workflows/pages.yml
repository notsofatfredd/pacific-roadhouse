name: Deploy Pacific Roadhouse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
      - name: Flatten project Pages export
        run: |
          cp -R ./dist/client/brand ./dist/client/pacific-roadhouse/brand
          cp -R ./dist/client/food ./dist/client/pacific-roadhouse/food
          cp ./dist/client/favicon.ico ./dist/client/pacific-roadhouse/favicon.ico
          cp ./dist/client/apple-icon.png ./dist/client/pacific-roadhouse/apple-icon.png
          cp ./dist/client/pacific-roadhouse/index.html ./dist/client/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
